<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Dados em Massa</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />

  <style>
    :root {
      --primary:       #2563EB;
      --primary-dark:  #1D4ED8;
      --primary-light: #EFF6FF;
      --success:       #16A34A;
      --bg:            #F1F5F9;
      --card-border:   #E2E8F0;
      --text-muted:    #64748B;
      --log-bg:        #0F172A;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    /* ── Navbar ────────────────────────────────────────────────────── */
    .app-navbar {
      background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(37,99,235,.4);
    }
    .app-navbar .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.3px;
    }
    .app-navbar .brand i { margin-right: 8px; }
    .app-navbar .badge-version {
      background: rgba(255,255,255,.15);
      color: #fff;
      font-size: .72rem;
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* ── Cards ─────────────────────────────────────────────────────── */
    .card {
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card-header {
      background: #fff;
      border-bottom: 1px solid var(--card-border);
      border-radius: 12px 12px 0 0 !important;
      padding: 12px 16px;
      font-weight: 600;
      font-size: .9rem;
    }
    .card-body { background: #fff; border-radius: 0 0 12px 12px; }

    /* ── Field cards (selection grid) ──────────────────────────────── */
    .field-card {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 2px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .12s, background .12s, color .12s;
      font-size: .8rem;
      background: #fff;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .field-card:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    .field-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }
    .field-card.selected::after {
      content: '✓';
      margin-left: auto;
      font-size: .75rem;
      color: var(--primary);
    }
    .category-label {
      text-transform: uppercase;
      font-size: .7rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: .06em;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    /* ── Selected field items ───────────────────────────────────────── */
    .sel-item {
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      background: #fafafa;
      margin-bottom: 6px;
      transition: opacity .15s;
    }
    .sel-item.dragging { opacity: .4; }
    .sel-item.drag-over { border-color: var(--primary); background: var(--primary-light); }
    .sel-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .83rem;
    }
    .sel-item-filters { margin-top: 8px; }
    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      padding: 0 4px;
      font-size: .8rem;
    }
    .drag-handle:active { cursor: grabbing; }
    .btn-move {
      background: none;
      border: none;
      padding: 0 3px;
      font-size: .7rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }
    .btn-move:hover { color: var(--primary); }
    .btn-move:disabled { opacity: .25; cursor: default; }

    /* ── Generate button ────────────────────────────────────────────── */
    .btn-generate {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      font-weight: 600;
      font-size: .95rem;
      width: 100%;
      transition: opacity .15s, transform .1s;
    }
    .btn-generate:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    .btn-generate:disabled { opacity: .6; }

    /* ── Save button ─────────────────────────────────────────────────── */
    .btn-save {
      background: linear-gradient(135deg, #16A34A 0%, #15803D 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: .95rem;
      white-space: nowrap;
      transition: opacity .15s, transform .1s;
    }
    .btn-save:hover { opacity: .9; transform: translateY(-1px); }
    .btn-save:active { transform: translateY(0); }

    /* ── Preview table ──────────────────────────────────────────────── */
    #preview-table { font-size: .78rem; }
    #preview-table th {
      background: #1E3A8A;
      color: #fff;
      white-space: nowrap;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    #preview-table td { white-space: nowrap; vertical-align: middle; }
    #preview-table tbody tr:hover { background: var(--primary-light); }

    /* ── Logs ───────────────────────────────────────────────────────── */
    #logs-box {
      background: var(--log-bg);
      color: #94A3B8;
      font-family: 'Courier New', monospace;
      font-size: .78rem;
      min-height: 80px;
      max-height: 220px;
      overflow-y: auto;
      padding: 12px 16px;
      border-radius: 0 0 12px 12px;
    }
    #logs-box .log-time { color: #475569; }
    #logs-box .log-ok   { color: #4ADE80; }
    #logs-box .log-err  { color: #F87171; }
    #logs-box .log-info { color: #60A5FA; }

    /* ── Misc ───────────────────────────────────────────────────────── */
    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 32px 16px;
    }
    .empty-msg i { font-size: 2rem; margin-bottom: 8px; display: block; }
    .section-scroll { max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .selected-scroll { max-height: 520px; overflow-y: auto; }

    /* ── Scrollbar ──────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────────── -->
<div class="app-navbar">
  <span class="brand"><i class="fas fa-database"></i>Gerador de Dados em Massa</span>
  <div class="d-flex align-items-center gap-2">
    <span id="save-badge" style="opacity:0;transition:opacity .4s;font-size:.72rem;color:#86efac;"><i class="fas fa-check-circle me-1"></i>Salvo</span>
    <span class="badge-version">v1.0</span>
  </div>
</div>

<div class="container-fluid py-3 px-3">

  <!-- ── Alert area ──────────────────────────────────────────────────────── -->
  <div id="alert-area"></div>

  <!-- ── Row 1: Config bar ───────────────────────────────────────────────── -->
  <div class="row mb-3">
    <div class="col-12">
      <div class="card">
        <div class="card-body py-2">
          <div class="row align-items-end g-2">
            <div class="col-sm-5 col-md-3">
              <label class="form-label fw-semibold mb-1 small">Quantidade de Registros</label>
              <div class="input-group input-group-sm">
                <input type="number" id="qty" class="form-control" value="100" min="1" max="50000" />
                <span class="input-group-text">registros</span>
              </div>
            </div>
            <div class="col-sm-4 col-md-2">
              <label class="form-label fw-semibold mb-1 small">Formato</label>
              <select id="fmt" class="form-select form-select-sm">
                <option value="csv">CSV</option>
                <option value="json">JSON</option>
                <option value="excel">Excel</option>
              </select>
            </div>
            <div class="col-sm-3 col-md-2">
              <button class="btn-save w-100" id="save-btn" onclick="onSave()">
                <i class="fas fa-floppy-disk me-2"></i>Salvar
              </button>
            </div>
            <div class="col-sm-12 col-md-5">
              <button class="btn-generate" id="gen-btn" onclick="onGenerate()">
                <i class="fas fa-bolt me-2"></i>Gerar Dados
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Row 2: Field selector + Selected fields ─────────────────────────── -->
  <div class="row mb-3 g-3">

    <!-- Left: categories -->
    <div class="col-lg-7">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="fas fa-list-check me-2 text-primary"></i>Selecione os Campos</span>
          <div class="d-flex gap-1">
            <button class="btn btn-xs btn-outline-primary" style="font-size:.75rem;padding:2px 8px" onclick="selectAll()">Todos</button>
            <button class="btn btn-xs btn-outline-secondary" style="font-size:.75rem;padding:2px 8px" onclick="selectNone()">Nenhum</button>
          </div>
        </div>
        <div class="card-body section-scroll" id="fields-container">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
            <div>Carregando campos…</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: selected + filters -->
    <div class="col-lg-5">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>
            <i class="fas fa-sliders me-2 text-primary"></i>
            Campos Selecionados
            <span class="badge bg-primary ms-1" id="sel-count">0</span>
          </span>
        </div>
        <div class="card-body selected-scroll" id="sel-container">
        </div>
      </div>
    </div>
  </div>

  <!-- ── Preview section (hidden until first generation) ─────────────────── -->
  <div class="row mb-3" id="preview-section" style="display:none">
    <div class="col-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <div>
            <i class="fas fa-table me-2 text-primary"></i>
            <strong>Preview dos Dados</strong>
            <span class="text-muted ms-2 small" id="preview-info"></span>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <span class="text-muted small me-1">Exportar:</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="doExport('csv')">
              <i class="fas fa-file-csv me-1"></i>CSV
            </button>
            <button class="btn btn-sm btn-outline-secondary" onclick="doExport('json')">
              <i class="fas fa-file-code me-1"></i>JSON
            </button>
            <button class="btn btn-sm btn-outline-success" onclick="doExport('excel')">
              <i class="fas fa-file-excel me-1"></i>Excel
            </button>
          </div>
        </div>
        <div class="card-body p-0" style="overflow:auto;max-height:420px;">
          <table class="table table-striped table-hover table-sm mb-0" id="preview-table">
            <thead id="pt-head"></thead>
            <tbody id="pt-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Logs ─────────────────────────────────────────────────────────────── -->
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="fas fa-terminal me-2 text-primary"></i>Logs de Execução</span>
          <button class="btn btn-xs btn-outline-secondary" style="font-size:.75rem;padding:2px 8px" onclick="clearLogs()">Limpar</button>
        </div>
        <div id="logs-box">
          <span class="log-info">Sistema pronto. Selecione campos e clique em "Gerar Dados".</span>
        </div>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
const S = {
  fieldDefs:  {},   // key → field definition object
  selected:   [],   // ordered array of selected field keys
  filters:    {},   // fieldKey → { filterKey: value }
  data:       [],   // generated records (all)
  sessionKey: null,
  fieldsLabels: [],
};

const STORAGE_KEY = 'dados_em_massa_v1';

function saveState() {
  const data = {
    selected: S.selected,
    filters:  S.filters,
    qty:      document.getElementById('qty') ? document.getElementById('qty').value : '100',
    fmt:      document.getElementById('fmt') ? document.getElementById('fmt').value : 'csv',
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    flashSaved();
  } catch (e) {
    console.error('[saveState] Falha ao salvar no localStorage:', e);
  }
}

function onSave() {
  saveState();
  const btn = document.getElementById('save-btn');
  if (!btn) return;
  const orig = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-check me-2"></i>Salvo!';
  btn.disabled = true;
  setTimeout(() => {
    btn.innerHTML = orig;
    btn.disabled = false;
  }, 1800);
}

function flashSaved() {
  const badge = document.getElementById('save-badge');
  if (!badge) return;
  badge.style.opacity = '1';
  clearTimeout(badge._t);
  badge._t = setTimeout(() => { badge.style.opacity = '0'; }, 1500);
}

function loadPersistedState() {
  let raw;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    console.error('[loadPersistedState] localStorage indisponível:', e);
    return;
  }
  if (!raw) return;

  let saved;
  try {
    saved = JSON.parse(raw);
  } catch (e) {
    console.error('[loadPersistedState] JSON inválido, limpando:', e);
    localStorage.removeItem(STORAGE_KEY);
    return;
  }

  const validKeys = Object.keys(S.fieldDefs);

  if (Array.isArray(saved.selected)) {
    S.selected = saved.selected.filter(k => validKeys.includes(k));
  }
  if (saved.filters && typeof saved.filters === 'object') {
    S.filters = saved.filters;
  }
  if (saved.qty) {
    const el = document.getElementById('qty');
    if (el) el.value = saved.qty;
  }
  if (saved.fmt) {
    const el = document.getElementById('fmt');
    if (el) el.value = saved.fmt;
  }

  S.selected.forEach(k => {
    const card = document.getElementById('fc-' + k);
    if (card) card.classList.add('selected');
  });
}

// ── Boot ───────────────────────────────────────────────────────────────────
(async function init() {
  try {
    const res  = await fetch('/api/fields');
    const body = await res.json();
    body.categories.forEach(cat => {
      cat.fields.forEach(f => { S.fieldDefs[f.key] = f; });
    });
    renderFieldGrid(body.categories);
    loadPersistedState();
    renderSelected();
    const savedCount = S.selected.length;
    if (savedCount > 0) {
      log('info', `${Object.keys(S.fieldDefs).length} campos carregados. ${savedCount} campo(s) restaurado(s) da sessão anterior.`);
    } else {
      log('info', `${Object.keys(S.fieldDefs).length} campos disponíveis carregados.`);
    }
  } catch (e) {
    alert('Falha ao carregar campos: ' + e.message);
  }
})();

// ── Field grid ─────────────────────────────────────────────────────────────
function renderFieldGrid(categories) {
  const container = document.getElementById('fields-container');
  container.innerHTML = '';

  categories.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'mb-3';
    section.innerHTML = `
      <div class="category-label">${cat.label}</div>
      <div class="row g-1">
        ${cat.fields.map(f => `
          <div class="col-6 col-sm-4">
            <div class="field-card" id="fc-${f.key}" onclick="toggleField('${f.key}')" title="${f.description}">
              <i class="${f.icon}" style="width:14px;text-align:center;flex-shrink:0"></i>
              <span style="overflow:hidden;text-overflow:ellipsis">${f.label}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(section);
  });
}

// ── Toggle field selection ─────────────────────────────────────────────────
function toggleField(key) {
  const idx = S.selected.indexOf(key);
  if (idx !== -1) {
    S.selected.splice(idx, 1);
    delete S.filters[key];
  } else {
    S.selected.push(key);
  }
  const card = document.getElementById('fc-' + key);
  if (card) card.classList.toggle('selected', S.selected.includes(key));
  renderSelected();
  saveState();
}

function selectAll() {
  Object.keys(S.fieldDefs).forEach(k => {
    if (!S.selected.includes(k)) S.selected.push(k);
    const c = document.getElementById('fc-' + k);
    if (c) c.classList.add('selected');
  });
  renderSelected();
  saveState();
}

function selectNone() {
  S.selected.forEach(k => {
    const c = document.getElementById('fc-' + k);
    if (c) c.classList.remove('selected');
  });
  S.selected.length = 0;
  S.filters = {};
  renderSelected();
  saveState();
}

// ── Column reorder ─────────────────────────────────────────────────────────
function moveField(key, dir) {
  const idx = S.selected.indexOf(key);
  if (idx === -1) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= S.selected.length) return;
  S.selected.splice(idx, 1);
  S.selected.splice(newIdx, 0, key);
  renderSelected();
  saveState();
  const fp = document.getElementById('fp-' + key);
  if (fp) fp.style.display = 'none';
}

// ── Drag-and-drop reorder ──────────────────────────────────────────────────
let _dragKey = null;

function onDragStart(e, key) {
  _dragKey = key;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const el = document.getElementById('si-' + key);
    if (el) el.classList.add('dragging');
  }, 0);
}

function onDragEnd(key) {
  const el = document.getElementById('si-' + key);
  if (el) el.classList.remove('dragging');
  document.querySelectorAll('.sel-item').forEach(el => el.classList.remove('drag-over'));
  _dragKey = null;
}

function onDragOver(e, key) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.sel-item').forEach(el => el.classList.remove('drag-over'));
  const el = document.getElementById('si-' + key);
  if (el && _dragKey !== key) el.classList.add('drag-over');
}

function onDrop(e, key) {
  e.preventDefault();
  document.querySelectorAll('.sel-item').forEach(el => el.classList.remove('drag-over'));
  if (!_dragKey || _dragKey === key) return;
  const fromIdx = S.selected.indexOf(_dragKey);
  const toIdx   = S.selected.indexOf(key);
  if (fromIdx === -1 || toIdx === -1) return;
  S.selected.splice(fromIdx, 1);
  S.selected.splice(toIdx, 0, _dragKey);
  renderSelected();
  saveState();
}

// ── Render selected panel ──────────────────────────────────────────────────
function renderSelected() {
  document.getElementById('sel-count').textContent = S.selected.length;
  const container = document.getElementById('sel-container');

  if (S.selected.length === 0) {
    container.innerHTML = `
      <div class="empty-msg">
        <i class="fas fa-hand-pointer"></i>
        Clique nos campos ao lado para selecioná-los
      </div>`;
    return;
  }

  const total = S.selected.length;
  let html = '';
  S.selected.forEach((key, idx) => {
    const f = S.fieldDefs[key];
    if (!f) return;
    const hasFilters = f.filter_options && f.filter_options.length > 0;
    html += `
      <div class="sel-item" id="si-${key}"
        draggable="true"
        ondragstart="onDragStart(event,'${key}')"
        ondragend="onDragEnd('${key}')"
        ondragover="onDragOver(event,'${key}')"
        ondrop="onDrop(event,'${key}')">
        <div class="sel-item-header">
          <span class="d-flex align-items-center gap-1">
            <span class="drag-handle" title="Arraste para reordenar"><i class="fas fa-grip-vertical"></i></span>
            <i class="${f.icon}" style="color:var(--primary)"></i>
            <strong>${f.label}</strong>
          </span>
          <div class="d-flex align-items-center gap-1">
            <button class="btn-move" title="Mover para cima"
              onclick="moveField('${key}',-1)" ${idx === 0 ? 'disabled' : ''}>
              <i class="fas fa-chevron-up"></i>
            </button>
            <button class="btn-move" title="Mover para baixo"
              onclick="moveField('${key}',1)" ${idx === total - 1 ? 'disabled' : ''}>
              <i class="fas fa-chevron-down"></i>
            </button>
            ${hasFilters ? `
              <button class="btn btn-xs btn-link p-0" style="font-size:.75rem"
                onclick="toggleFiltersPanel('${key}')">
                <i class="fas fa-filter" style="color:var(--text-muted)"></i>
              </button>` : ''}
            <button class="btn btn-xs btn-link p-0 text-danger" style="font-size:.75rem"
              onclick="toggleField('${key}')">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
        ${hasFilters ? `
          <div class="sel-item-filters" id="fp-${key}" style="display:none">
            ${renderFilterOptions(key, f.filter_options)}
          </div>` : ''}
      </div>`;
  });

  container.innerHTML = html;
}

function toggleFiltersPanel(key) {
  const el = document.getElementById('fp-' + key);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
}

function renderFilterOptions(fieldKey, opts) {
  return opts.map(opt => {
    const cur = (S.filters[fieldKey] || {})[opt.key] ?? opt.default ?? '';
    const id  = `fi-${fieldKey}-${opt.key}`;
    const onChange = `setFilter('${fieldKey}','${opt.key}',this.value)`;

    if (opt.type === 'select') {
      const options = opt.options.map(o =>
        `<option value="${o.value}" ${o.value == cur ? 'selected' : ''}>${o.label}</option>`
      ).join('');
      return `
        <div class="mb-1">
          <label class="form-label small mb-0" for="${id}">${opt.label}</label>
          <select id="${id}" class="form-select form-select-sm" onchange="${onChange}">${options}</select>
        </div>`;
    }

    if (opt.type === 'number') {
      return `
        <div class="mb-1">
          <label class="form-label small mb-0" for="${id}">${opt.label}</label>
          <input type="number" id="${id}" class="form-control form-control-sm"
            value="${cur}" min="${opt.min ?? 0}" max="${opt.max ?? 9999}"
            onchange="${onChange}" />
        </div>`;
    }

    if (opt.type === 'text') {
      return `
        <div class="mb-1">
          <label class="form-label small mb-0" for="${id}">${opt.label}</label>
          <input type="text" id="${id}" class="form-control form-control-sm"
            value="${cur}" oninput="${onChange}" placeholder="Deixe vazio para padrão" />
        </div>`;
    }
    return '';
  }).join('');
}

function setFilter(fieldKey, filterKey, value) {
  if (!S.filters[fieldKey]) S.filters[fieldKey] = {};
  const num = Number(value);
  S.filters[fieldKey][filterKey] = isNaN(num) || value === '' ? value : num;
  saveState();
}

// ── Generate ───────────────────────────────────────────────────────────────
async function onGenerate() {
  const fields = [...S.selected];
  if (!fields.length) { showAlert('Selecione pelo menos um campo!', 'warning'); return; }

  const qty = parseInt(document.getElementById('qty').value, 10);
  if (!qty || qty < 1 || qty > 50000) {
    showAlert('Quantidade deve ser entre 1 e 50.000.', 'warning'); return;
  }

  const btn = document.getElementById('gen-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Gerando…';
  log('info', `Iniciando geração: ${qty} registros × ${fields.length} campos…`);

  try {
    const res  = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields, count: qty, filters: S.filters }),
    });
    const body = await res.json();

    if (body.error) { showAlert(body.error, 'danger'); log('err', body.error); return; }

    S.data         = body.data;
    S.sessionKey   = body.key;
    S.fieldsLabels = body.fields_labels;

    renderPreview(body.data, body.fields_labels, qty);
    log('ok', `✓ ${qty} registros gerados com ${fields.length} campos em ${body.elapsed_ms} ms.`);

    document.getElementById('preview-section').style.display = '';
    document.getElementById('preview-section').scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (e) {
    showAlert('Erro ao comunicar com o servidor: ' + e.message, 'danger');
    log('err', '✗ ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-bolt me-2"></i>Gerar Dados';
  }
}

// ── Preview table ──────────────────────────────────────────────────────────
function renderPreview(data, labels, total) {
  const thead = document.getElementById('pt-head');
  const tbody = document.getElementById('pt-body');

  thead.innerHTML = '<tr>' + labels.map(l => `<th>${l.label}</th>`).join('') + '</tr>';

  const rows = data.slice(0, 50);
  tbody.innerHTML = rows.map(row =>
    '<tr>' + labels.map(l => `<td>${row[l.key] ?? ''}</td>`).join('') + '</tr>'
  ).join('');

  const shown = Math.min(rows.length, 50);
  document.getElementById('preview-info').textContent =
    `Exibindo ${shown} de ${total} registros`;
}

// ── Export ─────────────────────────────────────────────────────────────────
function doExport(fmt) {
  if (!S.sessionKey) { showAlert('Gere os dados primeiro!', 'warning'); return; }

  if (fmt === 'csv') {
    exportClientCSV();
  } else if (fmt === 'json') {
    exportClientJSON();
  } else {
    // Excel: server-side
    window.location.href = `/api/export/${S.sessionKey}?format=excel`;
    log('info', 'Download Excel iniciado…');
  }
}

function exportClientCSV() {
  if (!S.data.length) return;
  const labels = S.fieldsLabels;
  const keys   = labels.map(l => l.key);
  const header = labels.map(l => l.label).join(';');
  const rows   = S.data.map(row =>
    keys.map(k => {
      const v = String(row[k] ?? '');
      return v.includes(';') || v.includes('"') ? `"${v.replace(/"/g, '""')}"` : v;
    }).join(';')
  );
  const csv = '\ufeff' + [header, ...rows].join('\r\n');
  downloadBlob(csv, `dados_${ts()}.csv`, 'text/csv;charset=utf-8;');
  log('ok', `✓ CSV exportado (${S.data.length} registros).`);
}

function exportClientJSON() {
  if (!S.data.length) return;
  const json = JSON.stringify(S.data, null, 2);
  downloadBlob(json, `dados_${ts()}.json`, 'application/json');
  log('ok', `✓ JSON exportado (${S.data.length} registros).`);
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function ts() {
  return new Date().toISOString().replace(/[:.T]/g, '-').slice(0, 19);
}

// ── Logs ───────────────────────────────────────────────────────────────────
function log(type, msg) {
  const box  = document.getElementById('logs-box');
  const time = new Date().toLocaleTimeString('pt-BR');
  const entry = document.createElement('div');
  entry.innerHTML =
    `<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
  box.appendChild(entry);
  box.scrollTop = box.scrollHeight;
}

function clearLogs() {
  document.getElementById('logs-box').innerHTML =
    '<span class="log-info">Logs limpos.</span>';
}

// ── Alerts ─────────────────────────────────────────────────────────────────
function showAlert(msg, type) {
  const area = document.getElementById('alert-area');
  const id   = 'a' + Date.now();
  area.insertAdjacentHTML('beforeend', `
    <div class="alert alert-${type} alert-dismissible fade show py-2 small" id="${id}" role="alert">
      ${msg}
      <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>`);
  setTimeout(() => document.getElementById(id)?.remove(), 6000);
}
</script>
